<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet" href="styles.css"
    />
  </head>
  <body class="bg-light">
    <!-- <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1> -->
    <main class="d-flex align-items-center">
      <form action="/submit" class=" ira-form container mt-5 border border-2 shadow-sm bg-white rounded">
        <div class="row col-12 my-3">
          <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1>
        </div>
        <div class="row mb-3">
          <label class="col-form-label col-sm-6" for="balance">Balance ($)</label>
          <div class="col-sm-6">
            <input class="form-control" type="text" id="balance" name="balance" />
          </div>
        </div>
        <div class="row mb-3">
          <label class="col-form-label col-sm-6" for="contribution">Annual contribution ($)</label>
          <div class="col-sm-6">
            <input class="form-control" type="text" id="contribution" name="contribution" />
          </div>
        </div>
        <div>
          <fieldset class="row mb-3">
            <legend class="col-sm-6 col-form-label">Maximize contributions?</legend>
            <div class="col-sm-6">
              <div class="form-check">
                <input type="radio" class="form-check-input" id="yes" name="max"/>
                <label for="yes" class="form-check-label">Yes</label>
              </div>
              <div class="form-check">
                <input type="radio" class="form-check-input" id="no" name="max"/>
                <label for="no" class="form-check-label">No</label>
              </div>
            </div>
          </fieldset>
        </div>
        <div class="row mb-3">
          <label class="col-form-label col-sm-6" for="return">Expected rate of return %</label>
          <div class="col-sm-6">
            <input class="form-control" type="number" id="return" name="return">
          </div>
        </div>
        <div class="row mb-3">
          <label class="col-form-label col-sm-6" for="curr_age">Current Age</label>
          <div class="col-sm-6">
            <input class="form-control" type="number" id="curr_age" name="curr_age">
          </div>
        </div>
        <div class="row mb-3">
          <label class="col-form-label col-sm-6" for="ret_age">Retirement Age</label>
          <div class="col-sm-6">
            <input class="form-control" type="number" id="ret_age" name="ret_age">
          </div>
        </div>
        <div class="row mb-3">
          <label class="col-form-label col-sm-6" for="rate">Marginal tax rate (%)</label>
          <div class="col-sm-6">
            <input class="form-control" type="number" id="rate" name="rate">
          </div>
        </div>
        <div class="row my-4">
          <div class="d-flex gap-2">
            <input class="btn btn-primary w-100" type="submit" value="Calculate" />
            <input class="btn btn-outline-dark w-100" type="reset" value="Reset" />
          </div>
        </div>
        <footer class="mb-3">
          This exercise is a simplifed version of the Roth IRA Calculator at
          <a 
            class ="text-primary"
            href="https://www.calculator.net/">Calculator.net</a>
        </footer>
      </form>
    </main>
  </body>
</html>
